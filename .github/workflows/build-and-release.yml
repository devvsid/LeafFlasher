name: Build & Release Leaf Flasher
run-name: Leaf Flasher ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag to publish (e.g. v2.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Test & Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK & Licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Prepare Optional Release Signing Keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.LEAF_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_B64}" ]; then
            echo "${KEYSTORE_B64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "LEAF_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
            echo "HAS_SIGNING_KEY=true" >> "$GITHUB_ENV"
          else
            echo "HAS_SIGNING_KEY=false" >> "$GITHUB_ENV"
          fi

      - name: Build Android Release APK
        env:
          LEAF_KEYSTORE_PASSWORD: ${{ secrets.LEAF_KEYSTORE_PASSWORD }}
          LEAF_KEY_ALIAS: ${{ secrets.LEAF_KEY_ALIAS }}
          LEAF_KEY_PASSWORD: ${{ secrets.LEAF_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package APK & SHA-256 Checksum
        shell: bash
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_RELEASE_TAG}" ]]; then
            TAG_NAME="${INPUT_RELEASE_TAG}"
          else
            TAG_NAME="v${VERSION_NAME}"
          fi

          mkdir -p dist
          APK_NAME="LeafFlasher-by-sid-${TAG_NAME}.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/${APK_NAME}"
          else
            echo "Release APK output not found!" >&2
            exit 1
          fi

          (cd dist && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          APK_SHA256=$(cut -d' ' -f1 "dist/${APK_NAME}.sha256")

          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

          VERSION_CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          TAG_NOTES=""
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            TAG_NOTES=$(git tag -l --format='%(contents:body)' "${TAG_NAME}" | sed '/^[[:space:]]*$/d' || true)
          fi
          if [ -z "${TAG_NOTES}" ]; then
            PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -v "^${TAG_NAME}\$" | head -n1 || true)
            if [ -n "${PREV_TAG}" ]; then
              TAG_NOTES=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:'- %s' || true)
            fi
          fi
          if [ -z "${TAG_NOTES}" ]; then
            TAG_NOTES="- $(git log -1 --pretty=format:'%s')"
          fi

          {
            echo '<div align="center">'
            echo ''
            echo "<img src=\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/fastlane/metadata/android/en-US/images/featureGraphic.png\" alt=\"Leaf Flasher Banner\" width=\"760\" />"
            echo ''
            echo '</div>'
            echo ''
            echo "## <img src=\"https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/fastlane/metadata/android/en-US/images/icon.png\" width=\"28\" height=\"28\" alt=\"Leaf Flasher\" /> Leaf Flasher \`${TAG_NAME}\` by \`sid_imp\`"
            echo ''
            echo 'Android-to-Android USB OTG Fastboot, FastbootD, OTA `payload.bin`, and ADB Sideload flasher for flashing ROMs, extracting partition `.img` files, and sideloading recovery ZIPs without a PC.'
            echo ''
            echo "### What's New in ${TAG_NAME}"
            printf '%s\n' "${TAG_NOTES}"
            echo ''
            echo '### Release Files'
            echo "- **APK:** \`${APK_NAME}\` (\`versionCode ${VERSION_CODE}\`)"
            echo "- **SHA-256:** \`${APK_SHA256}\`"
            echo ''
            echo '```bash'
            echo "sha256sum -c ${APK_NAME}.sha256"
            echo '```'
            echo ''
            echo '### Links'
            echo "- Feature guide & build instructions: [README](https://github.com/${GITHUB_REPOSITORY}#readme)"
            echo '- F-Droid Request for Packaging: [fdroid/rfp#4779](https://gitlab.com/fdroid/rfp/-/work_items/4779)'
            echo '- Telegram: [@sid_imp](https://t.me/sid_imp)'
          } > dist/release-body.md

      - name: Upload CI Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LeafFlasher-${{ env.TAG_NAME }}
          path: |
            dist/*.apk
            dist/*.sha256
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Leaf Flasher ${{ env.TAG_NAME }}
          body_path: dist/release-body.md
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: |
            dist/*.apk
            dist/*.sha256
